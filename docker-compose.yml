services:

  postgres:
    image: postgres:16-alpine
    container_name: notification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-notification_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5443:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-notification_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build: .
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: ${DB_URL:-jdbc:postgresql://notification-db:5432/notification_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-myDefaultSecretKeyForDevOnlyChangeInProduction1234567890}
      TASK_SERVICE_URL: ${TASK_SERVICE_URL:-http://task-service:8082}
      ACADEMIC_SERVICE_URL: ${ACADEMIC_SERVICE_URL:-http://academic-service:8081}
      PLANNING_SERVICE_URL: ${PLANNING_SERVICE_URL:-http://planning-service:8084}
      SOCIAL_SERVICE_URL: ${SOCIAL_SERVICE_URL:-http://social-service:8086}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  notification_db_data:
